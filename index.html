<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Éolia — terres du vent</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0b1026;
    overflow: hidden;
    font-family: Georgia, 'Times New Roman', serif;
    -webkit-user-select: none; user-select: none;
  }
  #cv { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #overlay { position: fixed; inset: 0; }

  /* ----- écran titre ----- */
  #title {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 60%, rgba(10,16,38,0.25), rgba(6,9,20,0.78));
    color: #f3efe2;
    transition: opacity 2.2s ease;
    text-align: center;
  }
  #title.hide { opacity: 0; pointer-events: none; }
  #title h1 {
    font-size: clamp(52px, 11vw, 128px);
    font-weight: 400;
    letter-spacing: 0.22em;
    margin: 0 0 8px 0.22em;
    text-shadow: 0 2px 30px rgba(120, 200, 220, 0.35);
  }
  #title .sub {
    font-style: italic;
    font-size: clamp(16px, 2.6vw, 26px);
    letter-spacing: 0.35em;
    color: #bcd4d2;
    margin-bottom: 60px;
  }
  #title .cta {
    font-size: 18px;
    letter-spacing: 0.18em;
    color: #e9dfc0;
    animation: breathe 2.6s ease-in-out infinite;
  }
  @keyframes breathe { 0%,100% { opacity: 0.45; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { #title .cta { animation: none; } }

  /* ----- HUD ----- */
  .hud { position: fixed; color: #f3efe2; text-shadow: 0 1px 6px rgba(0,0,0,0.6); pointer-events: none; }
  #compass {
    top: 14px; left: 50%; transform: translateX(-50%);
    width: min(420px, 70vw); height: 30px;
    border-bottom: 1px solid rgba(243,239,226,0.35);
    overflow: hidden;
  }
  #compassInner { position: relative; width: 100%; height: 100%; }
  .cmark { position: absolute; top: 2px; transform: translateX(-50%); font-size: 16px; letter-spacing: 0.1em; }
  .cmark.card { color: #e9dfc0; }
  .cmark.dot { top: 9px; width: 9px; height: 9px; border-radius: 50%;
    background: #66e6d4; box-shadow: 0 0 8px #66e6d4; }
  .cmark.dot.found { background: #ffce54; box-shadow: 0 0 8px #ffce54; }
  #count {
    top: 16px; right: 22px;
    font-size: 19px; letter-spacing: 0.12em; color: #e9dfc0;
  }
  #count::before { content: '⬦ '; color: #66e6d4; }
  #toast {
    top: 18%; left: 50%; transform: translateX(-50%);
    font-size: clamp(18px, 3vw, 28px); font-style: italic;
    letter-spacing: 0.08em; color: #fdf6dd;
    opacity: 0; transition: opacity 0.8s ease;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; }
  #hints {
    left: 22px; bottom: 18px;
    font-family: 'Segoe UI', Avenir, system-ui, sans-serif;
    font-size: 13px; line-height: 1.75; color: rgba(243,239,226,0.75);
    transition: opacity 3s ease;
  }
  #hints.hide { opacity: 0; }
  #hints b { color: #e9dfc0; font-weight: 600; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="hud" id="compass"><div id="compassInner"></div></div>
<div class="hud" id="count">0 / 7</div>
<div class="hud" id="toast"></div>
<div class="hud" id="hints">
  <b>ZQSD / flèches</b> — se déplacer &nbsp;·&nbsp; <b>Maj</b> — courir<br>
  <b>Espace</b> — sauter &nbsp;·&nbsp; <b>Espace en l'air</b> — ouvrir le paravoile<br>
  <b>Glisser la souris</b> — regarder &nbsp;·&nbsp; <b>Molette</b> — zoom<br>
  Rejoins les piliers de lumière pour éveiller les sept sanctuaires.
</div>
<div id="overlay">
  <div id="title">
    <h1>ÉOLIA</h1>
    <div class="sub">TERRES DU VENT</div>
    <div class="cta">— clique pour t'éveiller —</div>
  </div>
</div>
<script src="three.min.js"></script>
<script src="game.js"></script>
</body>
</html>
