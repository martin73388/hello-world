<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LA ROUTE — tech demo</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b111e; }
  #rc { display: block; width: 100%; height: 100%; outline: none; }
  #boot {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    background: radial-gradient(ellipse at 50% 45%, #101a2e 0%, #0b111e 70%);
    color: #e8dcc8; font-family: Georgia, serif; transition: opacity .8s;
  }
  #boot.gone { opacity: 0; pointer-events: none; }
  #boot .t { font-size: 30px; letter-spacing: .5em; margin-left: .5em; color: #ffb066; }
  #boot .s { font-size: 12px; letter-spacing: .25em; opacity: .7; font-style: italic; }
  #boot .bar { width: 220px; height: 2px; background: rgba(232,220,200,.15); overflow: hidden; }
  #boot .bar i { display: block; height: 100%; width: 40%; background: #ffb066;
    animation: sweep 1.1s ease-in-out infinite; }
  @keyframes sweep { 0% { transform: translateX(-100%); } 100% { transform: translateX(320%); } }
  #boot .k { font-size: 11px; letter-spacing: .12em; opacity: .55; line-height: 2;
    text-align: center; font-style: normal; }
  #nogpu {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: #0b111e; color: #e8dcc8; font-family: Georgia, serif;
    font-size: 15px; letter-spacing: .05em; text-align: center; padding: 0 24px;
  }
</style>
</head>
<body>
<canvas id="rc"></canvas>
<div id="boot">
  <div class="t">LA ROUTE</div>
  <div class="s">préparation des pipelines…</div>
  <div class="bar"><i></i></div>
  <div class="k">ZQSD marcher · Maj courir · clic souris caméra · molette zoom · E monter/descendre<br>
    1 phares · 2 averse · 3 feu de camp · 4 heure dorée · 5 klaxon · F1 réglages</div>
</div>
<div id="nogpu">
  <div style="max-width:560px">
    <div style="letter-spacing:.4em;color:#ffb066;margin-bottom:14px">LA ROUTE</div>
    <div id="nogpuMsg" style="line-height:1.7;font-size:14px"></div>
    <div style="margin-top:22px">
      <button id="glBtn" style="background:none;border:1px solid rgba(232,220,200,.4);color:#e8dcc8;
        font:13px Georgia,serif;letter-spacing:.1em;padding:10px 18px;border-radius:6px;cursor:pointer">
        Lancer quand même en WebGL (mode développement)</button>
    </div>
  </div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
